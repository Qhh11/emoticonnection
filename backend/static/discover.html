<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover People - EmotiConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            padding: 30px;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: white;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: white;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .user-card {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }

        .user-card:hover {
            background: #f9fafb;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .user-username {
            font-size: 13px;
            color: #999;
        }

        .user-badge {
            font-size: 11px;
            background: #e8eaf6;
            color: #667eea;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .follow-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .follow-btn:hover {
            background: #667eea;
            color: white;
        }

        .follow-btn.following {
            background: #667eea;
            color: white;
        }

        .follow-btn.following:hover {
            background: #f44336;
            border-color: #f44336;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #999;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #999;
        }

        .stats {
            padding: 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='index.html'" title="Back to Dashboard">←</button>
            <div class="header-content">
                <h1>Discover People</h1>
                <p id="currentUserDisplay">Find people to connect with</p>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="followingCount">0</div>
                <div class="stat-label">Following</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="followersCount">0</div>
                <div class="stat-label">Followers</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('discover')">Discover</button>
            <button class="tab" onclick="switchTab('following')">Following</button>
            <button class="tab" onclick="switchTab('followers')">Followers</button>
        </div>

        <div class="tab-content active" id="discoverTab">
            <div class="loading" id="discoverLoading">Loading...</div>
            <div id="discoverList"></div>
        </div>

        <div class="tab-content" id="followingTab">
            <div class="loading" id="followingLoading">Loading...</div>
            <div id="followingList"></div>
        </div>

        <div class="tab-content" id="followersTab">
            <div class="loading" id="followersLoading">Loading...</div>
            <div id="followersList"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        let currentUserId = null;
        let currentUsername = '';

        // Check authentication
        const storedUserId = localStorage.getItem('chat_user_id');
        const storedUsername = localStorage.getItem('chat_username');

        if (!storedUserId) {
            window.location.href = 'login.html';
        } else {
            currentUserId = storedUserId;
            currentUsername = storedUsername;
            document.getElementById('currentUserDisplay').textContent = `Welcome, ${storedUsername}`;
        }

        // Load initial data
        async function init() {
            await loadStats();
            await loadDiscoverUsers();
            await loadFollowingUsers();
            await loadFollowers();
        }

        // Switch between tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}Tab`).classList.add('active');
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/social/stats/${currentUserId}`);
                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('followingCount').textContent = stats.following_count;
                    document.getElementById('followersCount').textContent = stats.followers_count;
                }
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        // Load discover users
        async function loadDiscoverUsers() {
            const loadingEl = document.getElementById('discoverLoading');
            const listEl = document.getElementById('discoverList');

            try {
                const response = await fetch(`${API_BASE}/social/discover/${currentUserId}`);
                if (response.ok) {
                    const users = await response.json();
                    loadingEl.style.display = 'none';

                    if (users.length === 0) {
                        listEl.innerHTML = `
                            <div class="empty-state">
                                <h3>No more users to discover</h3>
                                <p>You're following everyone!</p>
                            </div>
                        `;
                    } else {
                        listEl.innerHTML = users.map(user => createUserCard(user, 'discover')).join('');
                    }
                }
            } catch (e) {
                console.error('Failed to load discover users:', e);
                loadingEl.textContent = 'Failed to load';
            }
        }

        // Load following users
        async function loadFollowingUsers() {
            const loadingEl = document.getElementById('followingLoading');
            const listEl = document.getElementById('followingList');

            try {
                const response = await fetch(`${API_BASE}/social/following/${currentUserId}`);
                if (response.ok) {
                    const users = await response.json();
                    loadingEl.style.display = 'none';

                    if (users.length === 0) {
                        listEl.innerHTML = `
                            <div class="empty-state">
                                <h3>Not following anyone yet</h3>
                                <p>Check out the Discover tab!</p>
                            </div>
                        `;
                    } else {
                        listEl.innerHTML = users.map(user => createUserCard(user, 'following')).join('');
                    }
                }
            } catch (e) {
                console.error('Failed to load following:', e);
                loadingEl.textContent = 'Failed to load';
            }
        }

        // Load followers
        async function loadFollowers() {
            const loadingEl = document.getElementById('followersLoading');
            const listEl = document.getElementById('followersList');

            try {
                const response = await fetch(`${API_BASE}/social/followers/${currentUserId}`);
                if (response.ok) {
                    const users = await response.json();
                    loadingEl.style.display = 'none';

                    if (users.length === 0) {
                        listEl.innerHTML = `
                            <div class="empty-state">
                                <h3>No followers yet</h3>
                                <p>Keep sharing and connecting!</p>
                            </div>
                        `;
                    } else {
                        listEl.innerHTML = users.map(user => createUserCard(user, 'followers')).join('');
                    }
                }
            } catch (e) {
                console.error('Failed to load followers:', e);
                loadingEl.textContent = 'Failed to load';
            }
        }

        // Create user card HTML
        function createUserCard(user, context) {
            const initial = user.nickname ? user.nickname[0].toUpperCase() : user.username[0].toUpperCase();
            const mutualBadge = user.is_mutual ? '<span class="user-badge">Mutual</span>' : '';
            const followerBadge = user.is_follower ? '<span class="user-badge">Follows you</span>' : '';

            let button = '';
            if (context === 'discover') {
                button = `<button class="follow-btn" onclick="followUser('${user.id}')">Follow</button>`;
            } else if (context === 'following') {
                button = `<button class="follow-btn following" onclick="unfollowUser('${user.id}')">Following</button>`;
            } else if (context === 'followers') {
                if (user.is_following) {
                    button = `<button class="follow-btn following" onclick="unfollowUser('${user.id}')">Following</button>`;
                } else {
                    button = `<button class="follow-btn" onclick="followUser('${user.id}')">Follow Back</button>`;
                }
            }

            return `
                <div class="user-card">
                    <div class="user-avatar">${initial}</div>
                    <div class="user-info">
                        <div class="user-name">${user.nickname}${mutualBadge}${followerBadge}</div>
                        <div class="user-username">@${user.username}</div>
                    </div>
                    ${button}
                </div>
            `;
        }

        // Follow user
        async function followUser(targetUserId) {
            try {
                const response = await fetch(`${API_BASE}/social/follow?user_id=${currentUserId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_user_id: targetUserId })
                });

                if (response.ok) {
                    console.log('Followed successfully');
                    // Reload all tabs
                    await init();
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Failed to follow');
                }
            } catch (e) {
                console.error('Failed to follow:', e);
                alert('Failed to follow user');
            }
        }

        // Unfollow user
        async function unfollowUser(targetUserId) {
            if (!confirm('Unfollow this user?')) return;

            try {
                const response = await fetch(`${API_BASE}/social/unfollow?user_id=${currentUserId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_user_id: targetUserId })
                });

                if (response.ok) {
                    console.log('Unfollowed successfully');
                    // Reload all tabs
                    await init();
                } else {
                    const error = await response.json();
                    alert(error.detail || 'Failed to unfollow');
                }
            } catch (e) {
                console.error('Failed to unfollow:', e);
                alert('Failed to unfollow user');
            }
        }

        // Initialize
        if (storedUserId) {
            init();
        }
    </script>
</body>

</html>
