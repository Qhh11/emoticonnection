<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User 2 - EmotiConnect Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .header .subtitle {
            font-size: 12px;
            opacity: 0.9;
        }
        .status {
            font-size: 12px;
            margin-top: 5px;
        }
        .status.connected { color: #4caf50; }
        .status.disconnected { color: #ffeb3b; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }
        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.sent { text-align: right; }
        .message.received { text-align: left; }
        .message-bubble {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 60%;
            word-wrap: break-word;
        }
        .message.sent .message-bubble {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .message.received .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
        }
        .message-time {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 5px;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #f5576c;
        }
        .input-area button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-area button:hover {
            opacity: 0.9;
        }
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 User 2</h1>
            <div class="subtitle">Chatting with User 1</div>
            <div class="status" id="status">Connecting...</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const MY_USER_ID = 2;
        const OTHER_USER_ID = 1;
        const API_BASE = window.location.origin + '/api/v1';
        const WS_BASE = window.location.origin.replace('http', 'ws');

        let currentRoomId = null;
        let currentWebSocket = null;

        // Auto-connect on load
        init();

        async function init() {
            try {
                // Get or create room
                const room = await fetch(`${API_BASE}/chat/rooms`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user1_id: OTHER_USER_ID, user2_id: MY_USER_ID })
                }).then(r => r.json());

                currentRoomId = room.id;
                console.log('Room ID:', currentRoomId);

                // Load history
                const messages = await fetch(`${API_BASE}/chat/rooms/${currentRoomId}/messages`)
                    .then(r => r.ok ? r.json() : []);

                messages.forEach(msg => {
                    displayMessage(msg, msg.sender_id === MY_USER_ID);
                });

                // Connect WebSocket
                connectWebSocket(currentRoomId);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = '✗ Connection failed';
                alert('Failed to connect. Is the server running?');
            }
        }

        function connectWebSocket(roomId) {
            const wsUrl = `${WS_BASE}/ws/rooms/${roomId}`;
            console.log('Connecting to:', wsUrl);

            currentWebSocket = new WebSocket(wsUrl);

            currentWebSocket.onopen = () => {
                console.log('✅ Connected');
                document.getElementById('status').textContent = '✓ Connected';
                document.getElementById('status').className = 'status connected';
            };

            currentWebSocket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('📩 Received:', message);

                if (message.sender_id !== MY_USER_ID) {
                    displayMessage(message, false);
                }
            };

            currentWebSocket.onerror = (error) => {
                console.error('❌ Error:', error);
                document.getElementById('status').textContent = '✗ Error';
                document.getElementById('status').className = 'status disconnected';
            };

            currentWebSocket.onclose = () => {
                console.log('🔌 Disconnected');
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'status disconnected';
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content) return;

            if (!currentWebSocket || currentWebSocket.readyState !== WebSocket.OPEN) {
                alert('Not connected! Please refresh the page.');
                return;
            }

            const message = {
                sender_id: MY_USER_ID,
                content: content
            };

            console.log('📤 Sending:', message);
            currentWebSocket.send(JSON.stringify(message));

            displayMessage({
                sender_id: MY_USER_ID,
                content: content,
                created_at: new Date().toISOString()
            }, true);

            input.value = '';
        }

        function displayMessage(message, isSent) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = message.content;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date(message.created_at).toLocaleTimeString();

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(time);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.onbeforeunload = () => {
            if (currentWebSocket) currentWebSocket.close();
        };
    </script>
</body>
</html>
