<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - EmotiConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 700px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background: #f1f3f4;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }

        .sidebar-header {
            padding: 20px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item:hover {
            background: #e6e6e6;
        }

        .session-item.active {
            background: #daeaf5;
            color: #1a73e8;
            font-weight: 500;
        }

        .session-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        /* Chat Area Styles */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
            margin-right: 12px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            opacity: 0.9;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
            margin-right: 12px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message-bubble {
            max-width: 70%;
            min-width: 60px;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: break-word;
            word-break: keep-all;
            white-space: normal;
        }

        .message.ai .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4facfe;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-6px);
            }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #4facfe;
        }

        #sendButton {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .welcome-message h3 {
            color: #4facfe;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">
                    <span>+</span> New Chat
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <!-- Sessions will be loaded here -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <button class="back-btn" onclick="window.location.href='chat_main.html'">←</button>
                <div>
                    <h2>🤖 AI Companion</h2>
                </div>
                <div class="status" style="display: flex; align-items: center;">
                    <button class="action-btn" onclick="openDiary()">📔 Diary</button>
                    <button class="action-btn" onclick="endAndSave()">💾 End & Save</button>
                    Online
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="welcome-message">
                    <h3>Hello! I'm your EmotiConnect AI assistant</h3>
                    <p>I'm here to listen and provide emotional support</p>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Share your feelings..."
                    onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Chat state
        let chatHistory = [];
        let currentSessionId = null;

        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sessionListDiv = document.getElementById('sessionList');

        // Generate persistent user ID for testing
        const userId = localStorage.getItem('chat_user_id') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_user_id', userId);

        // API Base URL
        const API_BASE = 'http://localhost:8000/api/ai-chat';

        // Add message to UI
        function addMessage(role, content, timestamp = new Date()) {
            const welcome = messagesDiv.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'ai' ? '🤖' : '😊';

            const bubbleContainer = document.createElement('div');

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            bubbleContainer.appendChild(bubble);
            bubbleContainer.appendChild(time);

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubbleContainer);

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Show/hide typing indicator
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message ai';
            indicator.id = 'typing-indicator';
            indicator.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator active">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>
            `;
            messagesDiv.appendChild(indicator);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        // Load Sessions
        async function loadSessions() {
            try {
                const response = await fetch(`${API_BASE}/sessions?user_id=${userId}`);
                const sessions = await response.json();

                sessionListDiv.innerHTML = '';
                sessions.forEach(session => {
                    const el = document.createElement('div');
                    el.className = `session-item ${session.id === currentSessionId ? 'active' : ''}`;
                    el.onclick = () => loadSession(session.id);

                    const date = new Date(session.created_at || Date.now()).toLocaleDateString();
                    el.innerHTML = `
                        <div>Chat ${session.id.substr(-4)}</div>
                        <div class="session-time">${date}</div>
                    `;
                    sessionListDiv.appendChild(el);
                });
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        // Create New Chat
        async function createNewChat() {
            try {
                const response = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        message: "start", // Dummy message required by validation but ignored by this endpoint
                        history: []
                    })
                });
                const session = await response.json();
                currentSessionId = session.id;

                // Clear UI
                messagesDiv.innerHTML = `
                    <div class="welcome-message">
                        <h3>Hello! I'm your EmotiConnect AI assistant</h3>
                        <p>I'm here to listen and provide emotional support</p>
                    </div>
                `;
                chatHistory = [];

                await loadSessions();
            } catch (error) {
                console.error('Failed to create session:', error);
            }
        }

        // Load Specific Session
        async function loadSession(sessionId) {
            if (sessionId === currentSessionId) return;
            currentSessionId = sessionId;

            // Highlight active session
            loadSessions(); // Re-render list to update active class

            try {
                const response = await fetch(`${API_BASE}/sessions/${sessionId}/messages`);
                const messages = await response.json();

                messagesDiv.innerHTML = '';
                chatHistory = []; // Reset history for context window if needed, or rebuild it

                messages.forEach(msg => {
                    const role = msg.sender_type === 'user' ? 'user' : 'ai';
                    addMessage(role, msg.content, msg.created_at);

                    // Rebuild history logic if needed for context
                    // chatHistory.push({role: role === 'user' ? 'user' : 'model', parts: [msg.content]});
                });

            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            messageInput.disabled = true;
            sendButton.disabled = true;

            addMessage('user', message);
            messageInput.value = '';
            showTypingIndicator();

            try {
                const payload = {
                    user_id: userId,
                    message: message,
                    history: chatHistory
                };

                if (currentSessionId) {
                    payload.session_id = currentSessionId;
                }

                const response = await fetch(`${API_BASE}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                hideTypingIndicator();
                addMessage('ai', data.response);

                // If this was the first message and success, we might want to refresh session list
                // to show the new session if we didn't have an ID before (though createNewChat handles explicit creation)
                // If we started without explicit session ID, the backend created one.
                // We don't easily know the new ID unless the chat response returns it (which it currently doesn't, just text).
                // Enhancement: ChatResponse could include session_id.
                // For now, simple reload of list might catch it if we want.
                loadSessions();

            } catch (error) {
                hideTypingIndicator();
                console.error('Error:', error);
                addMessage('ai', 'Sorry, I encountered an issue. Please try again later.');
            } finally {
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        // End and Save Diary
        async function endAndSave() {
            if (!currentSessionId) {
                alert("Start a chat first!");
                return;
            }
            if (!confirm("End this conversation and generate a diary entry?")) return;

            addMessage('ai', "Generating your diary summary... Please wait a moment.");

            try {
                const response = await fetch(`${API_BASE}/diaries/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        user_id: userId
                    })
                });

                if (!response.ok) throw new Error("Failed to generate diary");

                // Redirect to Diary View
                window.location.href = 'diary_view.html';

            } catch (error) {
                console.error("Diary generation failed:", error);
                alert("Failed to generate diary. Please try again.");
            }
        }

        function openDiary() {
            window.location.href = 'diary_view.html';
        }

        // Init
        window.onload = () => {
            messageInput.focus();
            loadSessions();
        };
    </script>
</body>

</html>
