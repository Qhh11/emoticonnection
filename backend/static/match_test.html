<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EmotiConnect - Match Test (Auth Unified)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; }
    .wrap { max-width: 880px; margin: 24px auto; padding: 0 16px; }
    .card { background:#111c33; border:1px solid #22304f; border-radius:14px; padding:18px; margin-bottom:16px; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    h2 { margin: 0 0 12px; font-size: 16px; color:#cbd5e1; }
    label { display:block; margin:10px 0 6px; color:#cbd5e1; font-size: 13px; }
    input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #2a3a60; background:#0b1224; color:#e2e8f0; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { padding:10px 14px; border-radius:12px; border:0; cursor:pointer; font-weight:600; }
    .btn { background:#4f46e5; color:white; }
    .btn2 { background:#334155; color:#e2e8f0; }
    .btnDanger { background:#b91c1c; color:white; }
    .muted { color:#94a3b8; font-size: 12px; }
    .ok { color:#22c55e; }
    .warn { color:#f59e0b; }
    .err { color:#ef4444; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#0b1224; border:1px solid #2a3a60; margin-right:8px; font-size:12px; }
    .hidden { display:none; }
    a { color:#93c5fd; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Match Test (Auth Unified)</h1>
  <div class="muted">Open this page in <b>two windows</b> (normal + incognito). Login as two different users, then click Find Match.</div>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h2>1) Login (use Auth users)</h2>
    <label>Username</label>
    <input id="username" placeholder="e.g. alice" />
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" />
    <div style="display:flex; gap:10px; margin-top:12px;">
      <button class="btn" id="btnLogin">Login</button>
      <button class="btn2" id="btnLogout">Logout</button>
      <a class="muted" href="/static/register.html" target="_blank" style="align-self:center;">No account? Register</a>
    </div>
    <div style="margin-top:10px;">
      <span class="pill">Current User: <span id="whoami">-</span></span>
      <span id="loginMsg" class="muted"></span>
    </div>
    <div class="muted" style="margin-top:10px;">
      Token: <span id="tokenState">-</span>
    </div>
  </div>

  <!-- MATCH -->
  <div class="card" id="matchCard">
    <h2>2) Match Request</h2>
    <div class="row">
      <div>
        <label>Current Emotion</label>
        <select id="emotion">
          <option value="happy">happy</option>
          <option value="warm">warm</option>
          <option value="neutral">neutral</option>
          <option value="sad">sad</option>
          <option value="anxious" selected>anxious</option>
          <option value="stressed">stressed</option>
          <option value="uncertain">uncertain</option>
          <option value="lonely">lonely</option>
          <option value="grateful">grateful</option>
          <option value="calm">calm</option>
        </select>
      </div>
      <div>
        <label>Emotion Intensity (1-5)</label>
        <input id="intensity" type="number" min="1" max="5" value="3"/>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Role</label>
        <select id="role">
          <option value="seeker" selected>seeker</option>
          <option value="supporter">supporter</option>
          <option value="either">either</option>
        </select>
      </div>
      <div>
        <label>Support Need</label>
        <select id="need">
          <option value="vent" selected>vent</option>
          <option value="advice">advice</option>
          <option value="companion">companion</option>
          <option value="distraction">distraction</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Topic</label>
        <select id="topic">
          <option value="general" selected>general</option>
          <option value="relationships">relationships</option>
          <option value="anxiety">anxiety</option>
          <option value="depression">depression</option>
          <option value="work_stress">work_stress</option>
          <option value="academic">academic</option>
          <option value="family">family</option>
          <option value="loneliness">loneliness</option>
        </select>
      </div>
      <div>
        <label>Mode</label>
        <select id="mode">
          <option value="human_anonymous" selected>human_anonymous</option>
          <option value="human_non_anonymous">human_non_anonymous</option>
        </select>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:12px;">
      <button class="btn" id="btnFind">Find Match</button>
      <button class="btnDanger" id="btnCancel">Cancel</button>
      <button class="btn2" id="btnStatus">Check Status</button>
    </div>

    <div style="margin-top:12px;">
      <span class="pill">Status: <span id="statusText">-</span></span>
      <span class="pill">Room: <span id="roomText">-</span></span>
      <span class="pill">Peer: <span id="peerText">-</span></span>
    </div>

    <div style="margin-top:12px;" id="matchActions" class="hidden">
      <a id="openChat" class="btn" style="display:inline-block; text-decoration:none;" target="_blank">Open Chat</a>
    </div>

    <div class="muted" style="margin-top:12px;" id="log"></div>
  </div>
</div>

<script>
  const API_AUTH = "/api/auth";
  const API_MATCH = "/api/match";
  let pollTimer = null;

  function log(msg, cls="muted") {
    const el = document.getElementById("log");
    el.innerHTML = `<span class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</span><br/>` + el.innerHTML;
  }

  function authHeaders(extra = {}) {
    const token = localStorage.getItem("access_token");
    return {
      ...extra,
      ...(token ? { "Authorization": `Bearer ${token}` } : {})
    };
  }

  function getCurrentUser() {
    const id = localStorage.getItem("chat_user_id");
    const name = localStorage.getItem("chat_username");
    return { id, name };
  }

  function renderWhoami() {
    const { id, name } = getCurrentUser();
    document.getElementById("whoami").textContent = (id && name) ? `${name} (${id})` : "-";

    const token = localStorage.getItem("access_token");
    document.getElementById("tokenState").textContent = token ? "✅ present" : "❌ none";
    document.getElementById("tokenState").className = token ? "ok" : "err";
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  // --- AUTH ---
  async function login(username, password) {
    // ✅ login/register 不要带 Authorization
    const res = await fetch(`${API_AUTH}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  // --- MATCH APIs (token required) ---
  async function fetchStatus() {
    const token = localStorage.getItem("access_token");
    if (!token) throw new Error("Not logged in");

    // ✅ 后端统一：GET /api/match/status （不带 user_id）
    const res = await fetch(`${API_MATCH}/status`, {
      headers: authHeaders()
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  function applyMatched(data) {
    document.getElementById("statusText").textContent = "Matched!";
    document.getElementById("statusText").className = "ok";
    document.getElementById("roomText").textContent = data.room_id || "-";
    document.getElementById("peerText").textContent = data.matched_user_id || "-";

    const open = document.getElementById("openChat");
    // ✅ 更正规：不传 me，me 应该由 token 决定（peer_chat 未来也建议这么做）
    open.href = `/static/peer_chat.html?room=${encodeURIComponent(data.room_id)}&peer=${encodeURIComponent(data.matched_user_id)}`;
    document.getElementById("matchActions").classList.remove("hidden");
  }

  async function doFindMatch() {
    const token = localStorage.getItem("access_token");
    if (!token) { alert("Please login first"); return; }

    // ✅ 不再传 user_id，让后端从 JWT 里取 me["id"]
    const body = {
      current_emotion: document.getElementById("emotion").value,
      emotion_intensity: Number(document.getElementById("intensity").value || 3),
      role: document.getElementById("role").value,
      support_need: document.getElementById("need").value,
      topic: document.getElementById("topic").value,
      mode: document.getElementById("mode").value,
      risk_level: "safe"
    };

    document.getElementById("statusText").textContent = "Searching...";
    document.getElementById("statusText").className = "warn";
    document.getElementById("matchActions").classList.add("hidden");

    log(`POST /api/match/find`, "muted");

    const res = await fetch(`${API_MATCH}/find`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (data.matched) {
      applyMatched(data);
      stopPolling();
      log(`Matched immediately. room=${data.room_id}`, "ok");
      return;
    }

    document.getElementById("statusText").textContent = "In Queue";
    document.getElementById("statusText").className = "warn";
    log(`In queue. Start polling status...`, "muted");

    stopPolling();
    pollTimer = setInterval(async () => {
      try {
        const s = await fetchStatus();
        if (s.matched) {
          applyMatched(s);
          stopPolling();
          log(`Matched via polling. room=${s.room_id}`, "ok");
        }
      } catch (e) {}
    }, 1000);
  }

  async function doCancel() {
    const token = localStorage.getItem("access_token");
    if (!token) return;

    // ✅ 后端统一：POST /api/match/cancel （不带 user_id）
    const res = await fetch(`${API_MATCH}/cancel`, {
      method: "POST",
      headers: authHeaders()
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    stopPolling();
    document.getElementById("statusText").textContent = "Cancelled";
    document.getElementById("statusText").className = "muted";
    document.getElementById("matchActions").classList.add("hidden");
    log(`Cancelled`, "muted");
  }

  async function doCheckStatus() {
    const s = await fetchStatus();
    if (s.matched) applyMatched(s);
    else if (s.in_queue) {
      document.getElementById("statusText").textContent = "In Queue";
      document.getElementById("statusText").className = "warn";
    } else {
      document.getElementById("statusText").textContent = "Not in Queue";
      document.getElementById("statusText").className = "muted";
    }
    log(`GET /status => ${JSON.stringify(s)}`, "muted");
  }

  // buttons
  document.getElementById("btnLogin").onclick = async () => {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    const msg = document.getElementById("loginMsg");
    msg.textContent = "";
    try {
      const data = await login(u, p);

      // ✅ 这里假设后端 /auth/login 返回: { user_id, username(or nickname), access_token }
      // 你的 auth.py 目前返回的是 user_id + nickname，没有 access_token 的话，你需要后端补 token
      localStorage.setItem("chat_user_id", data.user_id);
      localStorage.setItem("chat_username", data.username || data.nickname || "user");
      if (data.access_token) localStorage.setItem("access_token", data.access_token);

      renderWhoami();
      msg.textContent = "Login OK";
      msg.className = "ok";
      log(`Login OK as ${localStorage.getItem("chat_username")} (${data.user_id})`, "ok");

      // 可选：登录后自动拉一下 status，验证 token 是否能用
      try {
        await fetchStatus();
        log(`Token OK: /match/status accessible`, "ok");
      } catch (e) {
        log(`Token check failed: ${e.message}`, "err");
      }

    } catch (e) {
      msg.textContent = String(e.message || e);
      msg.className = "err";
      log(`Login failed: ${e.message}`, "err");
    }
  };

  document.getElementById("btnLogout").onclick = () => {
    stopPolling();
    localStorage.removeItem("chat_user_id");
    localStorage.removeItem("chat_username");
    localStorage.removeItem("access_token");
    renderWhoami();
    log("Logged out", "muted");
  };

  document.getElementById("btnFind").onclick = () => doFindMatch().catch(e => log(e.message, "err"));
  document.getElementById("btnCancel").onclick = () => doCancel().catch(e => log(e.message, "err"));
  document.getElementById("btnStatus").onclick = () => doCheckStatus().catch(e => log(e.message, "err"));

  renderWhoami();
</script>
</body>
</html>
