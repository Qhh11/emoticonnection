<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmotiConnect - Match Test V2</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Segoe UI,system-ui,-apple-system,sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;padding:20px
    }
    .container{max-width:1200px;margin:0 auto}
    h1{color:#fff;text-align:center;margin-bottom:6px}
    .subtitle{color:rgba(255,255,255,.9);text-align:center;margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width: 900px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
    .card h2{font-size:18px;color:#333;margin-bottom:12px}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:12px;margin-right:8px}
    label{display:block;margin:10px 0 6px;color:#555;font-weight:600;font-size:13px}
    input,select{width:100%;padding:10px 12px;border:2px solid #e6e6e6;border-radius:10px;font-size:14px}
    input:focus,select:focus{outline:none;border-color:#667eea}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px}
    .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .btn-secondary{background:#f3f3f3;color:#444}
    .status{
      margin-top:14px;background:#f7f8ff;border-radius:12px;padding:12px
    }
    .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
    .kv:last-child{border-bottom:none}
    .v{font-weight:800}
    .v.waiting{color:#f59e0b}
    .v.matched{color:#22c55e}
    .v.error{color:#ef4444}
    .result{margin-top:12px;border-radius:12px;padding:14px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);text-align:center}
    .result.hidden{display:none}
    .score{font-size:34px;font-weight:900;color:#22c55e;margin:6px 0}
    .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
    .tag{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(34,197,94,.15);color:#166534}
    .chatlink{
      display:block;margin-top:12px;text-decoration:none;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff;padding:12px;border-radius:10px;font-weight:800
    }
    .log{
      margin-top:16px;background:#111827;color:#cbd5e1;border-radius:12px;
      padding:12px;max-height:200px;overflow:auto;font-family:Consolas,monospace;font-size:12px
    }
    .log .ok{color:#22c55e}
    .log .err{color:#ef4444}
    .log .info{color:#60a5fa}
  </style>
</head>
<body>
<div class="container">
  <h1>🎯 EmotiConnect Match Test</h1>
  <div class="subtitle">V2 complementary matching (seeker/supporter + need/topic)</div>

  <div class="grid">
    <!-- User 1 -->
    <div class="card">
      <h2><span class="badge">User 1</span>Config</h2>

      <label>User ID</label>
      <input id="user1-id" type="number" value="1" min="1"/>

      <label>Current Emotion</label>
      <select id="user1-emotion">
        <option value="sad" selected>😢 sad</option>
        <option value="anxious">😰 anxious</option>
        <option value="stressed">😫 stressed</option>
        <option value="warm">💛 warm</option>
        <option value="friendly">🤝 friendly</option>
        <option value="neutral">😐 neutral</option>
        <option value="happy">😊 happy</option>
      </select>

      <label>Emotion Intensity (1-5)</label>
      <input id="user1-intensity" type="number" value="3" min="1" max="5"/>

      <div class="row">
        <div>
          <label>Role</label>
          <select id="user1-role">
            <option value="seeker" selected>🙋 seeker</option>
            <option value="supporter">🤗 supporter</option>
            <option value="either">💬 either</option>
          </select>
        </div>
        <div>
          <label>Need</label>
          <select id="user1-need">
            <option value="vent" selected>💭 vent</option>
            <option value="advice">💡 advice</option>
            <option value="companion">🫂 companion</option>
            <option value="distraction">🎮 distraction</option>
          </select>
        </div>
      </div>

      <label>Topic</label>
      <select id="user1-topic">
        <option value="general" selected>💬 general</option>
        <option value="work_stress">💼 work_stress</option>
        <option value="academic">📚 academic</option>
        <option value="relationships">💑 relationships</option>
      </select>

      <label>Mode</label>
      <select id="user1-mode">
        <option value="human_anonymous" selected>🎭 human_anonymous</option>
        <option value="human_non_anonymous">👤 human_non_anonymous</option>
      </select>

      <button class="btn btn-primary" onclick="findMatch(1)">🔍 Find Match</button>
      <button class="btn btn-secondary" onclick="cancelMatch(1)">❌ Cancel</button>

      <div class="status">
        <div class="kv"><span>Status</span><span id="user1-status" class="v">Not Started</span></div>
        <div class="kv"><span>Queue Position</span><span id="user1-queue" class="v">-</span></div>
        <div class="kv"><span>Est. Wait</span><span id="user1-wait" class="v">-</span></div>
      </div>

      <div id="user1-result" class="result hidden">
        <div><b>🎉 Match Found!</b></div>
        <div class="score" id="user1-score">-</div>
        <div class="tags" id="user1-reason"></div>
        <a id="user1-chat" class="chatlink" href="#" target="_blank">💬 Open Chat</a>
      </div>
    </div>

    <!-- User 2 -->
    <div class="card">
      <h2><span class="badge">User 2</span>Config</h2>

      <label>User ID</label>
      <input id="user2-id" type="number" value="2" min="1"/>

      <label>Current Emotion</label>
      <select id="user2-emotion">
        <option value="warm" selected>💛 warm</option>
        <option value="friendly">🤝 friendly</option>
        <option value="neutral">😐 neutral</option>
        <option value="happy">😊 happy</option>
        <option value="anxious">😰 anxious</option>
        <option value="sad">😢 sad</option>
      </select>

      <label>Emotion Intensity (1-5)</label>
      <input id="user2-intensity" type="number" value="2" min="1" max="5"/>

      <div class="row">
        <div>
          <label>Role</label>
          <select id="user2-role">
            <option value="supporter" selected>🤗 supporter</option>
            <option value="seeker">🙋 seeker</option>
            <option value="either">💬 either</option>
          </select>
        </div>
        <div>
          <label>Need</label>
          <select id="user2-need">
            <option value="companion" selected>🫂 companion</option>
            <option value="vent">💭 vent</option>
            <option value="advice">💡 advice</option>
            <option value="distraction">🎮 distraction</option>
          </select>
        </div>
      </div>

      <label>Topic</label>
      <select id="user2-topic">
        <option value="general" selected>💬 general</option>
        <option value="work_stress">💼 work_stress</option>
        <option value="academic">📚 academic</option>
        <option value="relationships">💑 relationships</option>
      </select>

      <label>Mode</label>
      <select id="user2-mode">
        <option value="human_anonymous" selected>🎭 human_anonymous</option>
        <option value="human_non_anonymous">👤 human_non_anonymous</option>
      </select>

      <button class="btn btn-primary" onclick="findMatch(2)">🔍 Find Match</button>
      <button class="btn btn-secondary" onclick="cancelMatch(2)">❌ Cancel</button>

      <div class="status">
        <div class="kv"><span>Status</span><span id="user2-status" class="v">Not Started</span></div>
        <div class="kv"><span>Queue Position</span><span id="user2-queue" class="v">-</span></div>
        <div class="kv"><span>Est. Wait</span><span id="user2-wait" class="v">-</span></div>
      </div>

      <div id="user2-result" class="result hidden">
        <div><b>🎉 Match Found!</b></div>
        <div class="score" id="user2-score">-</div>
        <div class="tags" id="user2-reason"></div>
        <a id="user2-chat" class="chatlink" href="#" target="_blank">💬 Open Chat</a>
      </div>
    </div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  const API_BASE = "/api/match";
  const pollTimers = { 1: null, 2: null };

  function log(msg, type="info") {
    const el = document.getElementById("log");
    const cls = type === "ok" ? "ok" : (type==="err"?"err":"info");
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.prepend(line);
  }

  function startPolling(userNum) {
    stopPolling(userNum);
    pollTimers[userNum] = setInterval(() => checkStatus(userNum), 1000);
  }

  function stopPolling(userNum) {
    if (pollTimers[userNum]) {
      clearInterval(pollTimers[userNum]);
      pollTimers[userNum] = null;
    }
  }

  function setStatus(userNum, text, cls="") {
    const s = document.getElementById(`user${userNum}-status`);
    s.textContent = text;
    s.className = `v ${cls}`.trim();
  }

  function showMatch(userNum, data) {
    setStatus(userNum, "Matched!", "matched");
    document.getElementById(`user${userNum}-queue`).textContent = "-";
    document.getElementById(`user${userNum}-wait`).textContent = "-";

    const result = document.getElementById(`user${userNum}-result`);
    result.classList.remove("hidden");

    if (data.match_score !== undefined && data.match_score !== null) {
      document.getElementById(`user${userNum}-score`).textContent = Number(data.match_score).toFixed(1);
    } else {
      document.getElementById(`user${userNum}-score`).textContent = "-";
    }

    const tags = document.getElementById(`user${userNum}-reason`);
    const reason = (data.match_reason || "").split("+").filter(Boolean);
    tags.innerHTML = reason.map(r => `<span class="tag">${r.replace(/_/g," ")}</span>`).join("");

    const userId = document.getElementById(`user${userNum}-id`).value;
    if (data.room_id) {
      document.getElementById(`user${userNum}-chat`).href =
        `/static/peer_chat.html?room=${encodeURIComponent(data.room_id)}&user=${encodeURIComponent(userId)}`;
    }

    stopPolling(userNum);
  }

  async function checkStatus(userNum) {
    const userId = document.getElementById(`user${userNum}-id`).value;
    try {
      const res = await fetch(`${API_BASE}/status/${userId}`);
      if (!res.ok) return;
      const data = await res.json();

      if (data.matched) {
        log(`User${userNum} status => matched (room=${data.room_id})`, "ok");
        showMatch(userNum, data);
        return;
      }

      if (data.in_queue) {
        setStatus(userNum, "In Queue", "waiting");
        document.getElementById(`user${userNum}-queue`).textContent = data.queue_position ?? "-";
        document.getElementById(`user${userNum}-wait`).textContent = data.estimated_wait ?? "-";
        return;
      }

      // not in queue, not matched (maybe cancel / expired)
      setStatus(userNum, "Not in Queue", "");
      document.getElementById(`user${userNum}-queue`).textContent = "-";
      document.getElementById(`user${userNum}-wait`).textContent = "-";
    } catch (e) {
      // silent
    }
  }

  async function findMatch(userNum) {
    const userId = Number(document.getElementById(`user${userNum}-id`).value);
    const body = {
      user_id: userId,
      current_emotion: document.getElementById(`user${userNum}-emotion`).value,
      emotion_intensity: Number(document.getElementById(`user${userNum}-intensity`).value),
      role: document.getElementById(`user${userNum}-role`).value,
      support_need: document.getElementById(`user${userNum}-need`).value,
      topic: document.getElementById(`user${userNum}-topic`).value,
      mode: document.getElementById(`user${userNum}-mode`).value,
      risk_level: "safe"
    };

    log(`User${userNum} POST /find (id=${userId})`, "info");
    setStatus(userNum, "Searching...", "waiting");

    try {
      const res = await fetch(`${API_BASE}/find`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (data.matched) {
        log(`User${userNum} matched immediately (room=${data.room_id})`, "ok");
        showMatch(userNum, data);
      } else {
        log(`User${userNum} queued (pos=${data.queue_position ?? "?"})`, "info");
        setStatus(userNum, "In Queue", "waiting");
        document.getElementById(`user${userNum}-queue`).textContent = data.queue_position ?? "-";
        document.getElementById(`user${userNum}-wait`).textContent = data.estimated_wait ?? "-";
        startPolling(userNum);
      }
    } catch (e) {
      setStatus(userNum, "Error", "error");
      log(`User${userNum} find error: ${e.message}`, "err");
    }
  }

  async function cancelMatch(userNum) {
    const userId = document.getElementById(`user${userNum}-id`).value;
    try {
      await fetch(`${API_BASE}/cancel/${userId}`, { method: "POST" });
    } catch (e) {}
    stopPolling(userNum);
    document.getElementById(`user${userNum}-result`).classList.add("hidden");
    setStatus(userNum, "Cancelled", "");
    document.getElementById(`user${userNum}-queue`).textContent = "-";
    document.getElementById(`user${userNum}-wait`).textContent = "-";
    log(`User${userNum} cancelled`, "info");
  }

  log("Match Test V2 ready. Tip: open in two windows, click Find Match for both users.", "ok");
</script>
</body>
</html>
