<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EmotionConnect - Register</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 24px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      color: #d32f2f;
      margin-bottom: 10px;
      font-size: 14px;
      display: none;
    }

    .success {
      color: #006400;
      margin-bottom: 10px;
      font-size: 14px;
      display: none;
    }

    .link {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .link a {
      color: #00f2fe;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Create Account</h1>
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>
    <form id="registerForm">
      <input name="username" placeholder="Username" required />
      <input name="password" type="password" placeholder="Password" required />
      <input name="email" type="email" placeholder="Email (optional)" />
      <input name="nickname" placeholder="Nickname (optional)" />
      <button type="submit" id="btnSubmit">Register</button>
    </form>
    <div class="link">
      Already have an account? <a href="login.html">Log in here</a>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api/auth';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('btnSubmit');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      btn.disabled = true;
      btn.textContent = 'Registering...';
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      const payload = {
        username: form.username.value,
        password: form.password.value,
        email: form.email.value || null,
        nickname: form.nickname.value || null
      };

      try {
        const response = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          successMsg.textContent = "Registration successful! Redirecting...";
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          // Try to show detail
          const msg = data.detail || "Registration failed";
          throw new Error(msg);
        }
      } catch (error) {
        console.error(error);
        errorMsg.textContent = error.message.includes('fetch') ? "Network error" : error.message;
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    });
  </script>
</body>

</html>
